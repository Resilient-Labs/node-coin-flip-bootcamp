<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="Coin Flip" content="User gets heads or tails result and shows win or lose">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Coin Flip Game</title>
		<!-- external CSS link -->
		 <link rel="stylesheet" href="css/normalize.css">
		 <link rel="stylesheet" href="css/style.css">
	</head>

<body>
		<header>
		<h1>Coin Flip Game</h1>
		<p>Hello! Let's play a quick game. You win when you flip a heads and lose on tails. Have fun!</p>
		</header>
	<section class="container">
		<p>What is your pick? Do you choose Heads Or Tails?</p>
		<select class="guess">
			<option value="Heads">Heads</option>
			<option value="Tails">Tails</option>
		</select>
		<button id="button">Game Start!</button>
		<div class="game"><!--Flips between heads or tails--></div>
    	<h2 class="result"><!--Insert Win or Lose--></h2>
	</section>
	<script type="text/javascript" src="js/main.js"></script>
</body>
</html>

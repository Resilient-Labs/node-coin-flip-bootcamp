<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    
		<title>COIN</title>
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<header>
			<nav>
				<h1>COIN FLIP FLIP</h1>
			</nav>
		</header>
		<main class="container">
			<section class="container-results">
				<div class="score">
					<h3>SCORE:</h3>
					<h2 class="txt-score">0</h2>
				</div>
			</section>
			<section class="coin-container">
				<img src="img/coin.gif" alt="Coin flipping" class="coin" id="coin-image">
			</section>
			<section class="container-controls">
				<h3>Choose your side:</h3>
				<section class="container-sides">
					<button class="btn-flip-coin" id="head">HEADS</button>
					<button class="btn-flip-coin" id="tail">TAILS</button>
				</section>
				<button class="btn-flip-coin" id="start-again">START AGAIN</button>
			</section>
			<h2 class="result"></h2>
		</main>
		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>

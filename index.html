<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Coin Toss!</title>
        <meta charset="utf-8">
        <meta name="description" content="A simple coin toss game to work on using Node.js">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=Limelight&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <section class="title">
            <h1>Coin Guessing Game</h1>
        </section>
        <section class="container">
            <section class="instructions">
                <h3>Take a guess!</h3>
            </section>
            <section class="buttons">
                <button id="heads" value="1">Heads</button>
                <button id="tails" value="2">Tails</button>
            </section>
            <div id="coin">
                <div class="side-a"></div>
                <div class="side-b"></div>
            </div>
            <section class="coinR">
                <h2 id="coinResult"></h2>
            </section>
        </section>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>

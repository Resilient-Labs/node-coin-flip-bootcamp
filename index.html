<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict and Flip Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Predict and Flip</h1>
    <p>Make a prediction by choosing 'Heads' or 'Tails' then flip the coin to see if you guessed it right.</p>
    <section id ="containerGuessBtns">
    <button id="guessHeadsBtn">Heads</button>
    <button id="guessTailsBtn">Tails</button>
    </section>
    <section id="containerFlipBtn">
    <button id="flipbtn">Flip Coin</button>
    </section>
    <section class = "coin" >
        <span class="heads">Heads</span>
      
    </section>
    <section id="result">
    <h2></h2>
    </section>
    
    <script src="js/main.js"></script>
</body>
</html>

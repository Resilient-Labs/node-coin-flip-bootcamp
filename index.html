<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Coin Flipper</title>

        <link rel="stylesheet" href="./css/modern-normalize.css">
        <link rel="stylesheet" href="./css/styles.css">
    </head>

    <body>

        <header>
            <h1>Coin Flipper </h1>
        </header>

        <main>

            <section>
                <h2>Click a face and flip the coin.</h2>

                <div id="callHeads">
                    <img src="./images/head.png" alt="Head icons created by Gregor Cresnar - Flaticon">
                    <span>HEADS</span>
                </div>

                <div id="callTails">
                    <img src="./images/whale.png" alt="Whale tail icons created by Fahrul Saputra - Flaticon">
                    <span>TAILS</span>
                </div>
            </section>

            <section>
                <h3 id="coinFace"></h3>
            </section>

        </main>

        <footer>
            <small>Made by: Niles</small>
        </footer>

        <script src="./js/main.js"></script>

    </body>

</html>

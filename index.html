<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Carter+One&family=Edu+NSW+ACT+Cursive:wght@400..700&family=Honk:MORF@15&family=Lilita+One&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Permanent+Marker&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Titan+One&family=Unkempt:wght@400;700&family=Zen+Dots&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Coin Flip Game</h1>

    <p>Feeling lucky? Write your guess!</p>
    <section class="imgContainer">
        <img src="/img/coin-flip-59.gif" alt="gif of a coin spinning">
    </section>
    
    <section class = "container">
        <section class = "flexContainer">
            <input id="coinChoice" type="text" placeholder="e.g. heads">
            <button id ="buttonFlip">Flip Coin</button>
        </section>
       
        <p id="choice"></p>
        <p id="message"></p>
        <p id="outcome"></p>
    </section>
    
<script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Coin Flip</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="container">
    <h1>Heads or Tails?</h1>

    <form action="">
      <fieldset>
        <input id="heads" type="radio" value="heads" name="coin" checked>
        <label for="heads">Heads</label>

        <input id="tails" type="radio" value="tails" name="coin">
        <label for="tails">Tails</label>
      </fieldset>
      <button id="clickMe" type="button" name="button">Click Me</button>
    </form>

    <h2 id="result"></h2>
  
  </div>

  <script type="text/javascript" src="/js/main.js"></script>
</body>

</html>
